<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1460" height="735" viewBox="0 0 1460 735" role="img" aria-labelledby="title description">
  <title id="title">The example task.md file in a code editor</title>
  <desc id="description">A dark IDE-style editor displaying a Markdown task file with syntax highlighting.</desc>
  <defs>
    <style>
      .code { font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; font-size: 18px; font-weight: 450; }
