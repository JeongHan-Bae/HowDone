    <text x="76" y="353" class="code"><tspan class="bullet">&#160;&#160;&#160;&#160;*</tspan><tspan class="plain">&#160;</tspan><tspan class="unchecked">[&#160;]</tspan><tspan class="plain">&#160;Identify&#160;Technical&#160;Constraints</tspan></text>
