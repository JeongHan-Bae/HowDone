      .heading-mark { fill: #c792ea; }
      .heading-text { fill: #82aaff; }
      .bullet { fill: #f78c6c; }
      .checked { fill: #c3e88d; }
      .unchecked { fill: #ffcb6b; }
      .line-number { fill: #59616d; font-family: "SFMono-Regular", "Cascadia Code", Menlo, monospace; font-size: 15px; }
      .tab { fill: #d6d9df; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; }
    </style>
  </defs>
