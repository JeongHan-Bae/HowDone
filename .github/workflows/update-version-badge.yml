name: Update Version Badge

on:
  push:
    branches:
      - main
    paths:
      - "packages/core/package.json"
      - "packages/cli/package.json"
      - ".github/workflows/update-version-badge.yml"
      - "scripts/update-version-badge.mjs"
  workflow_dispatch:

jobs:
  update-version-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18.x"

      - name: Generate Version Badges
        id: generate_badges
        run: npm run badge:version

      - name: Check if Version Badges changed
        id: check_diff
        run: |
          git add version_badge.json version_badge_cli.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if author is allowed to update
        id: check_author
        run: |
          if [[ "${{ github.actor }}" == "JeongHan-Bae" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not authorized to commit. Actor is ${{ github.actor }}."
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH keys
        if: steps.check_diff.outputs.changed == 'true' && steps.check_author.outputs.authorized == 'true'
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
          SSH_AUTH_KEY: ${{ secrets.SSH_AUTH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          if [ -z "$SSH_SIGNING_KEY" ]; then
            echo "SSH_SIGNING_KEY is empty"
            exit 1
          fi

          if [ -z "$SSH_AUTH_KEY" ]; then
            echo "SSH_AUTH_KEY is empty"
            exit 1
          fi

          printf '%s\n' "$SSH_SIGNING_KEY" | tr -d '\r' > ~/.ssh/id_ed25519_signing
          printf '%s\n' "$SSH_AUTH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519_github_actions

          chmod 600 ~/.ssh/id_ed25519_signing
          chmod 600 ~/.ssh/id_ed25519_github_actions

          ssh-keygen -y -f ~/.ssh/id_ed25519_signing > ~/.ssh/id_ed25519_signing.pub

          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_github_actions
            IdentitiesOnly yes
          EOF

          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519_signing
          ssh -T git@github.com || true

      - name: Configure Git for Signed Commits
        if: steps.check_diff.outputs.changed == 'true' && steps.check_author.outputs.authorized == 'true'
        run: |
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/id_ed25519_signing
          git config --global commit.gpgsign true
          git config --global user.name "JeongHan-Bae"
          git config --global user.email "mastropseudo@gmail.com"

      - name: Commit and push Version Badges
        if: steps.check_diff.outputs.changed == 'true' && steps.check_author.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          git add version_badge.json version_badge_cli.json
          if git diff --cached --quiet; then
            echo "No version badge changes to commit."
            exit 0
          fi
          core_message=""
          cli_message=""
          if ! git diff --cached --quiet -- version_badge.json; then
            core_message="Core version: ${{ steps.generate_badges.outputs.core_version }}"
          fi
          if ! git diff --cached --quiet -- version_badge_cli.json; then
            cli_message="CLI version: ${{ steps.generate_badges.outputs.cli_version }}"
          fi
          if [ -n "$core_message" ] && [ -n "$cli_message" ]; then
            commit_body="$(printf '%s\n%s' "$core_message" "$cli_message")"
          elif [ -n "$core_message" ]; then
            commit_body="$core_message"
          else
            commit_body="$cli_message"
          fi
          git commit -S -m "auto-update(version): sync generated badges" -m "$commit_body"
          git push "git@github.com:${{ github.repository }}.git"
