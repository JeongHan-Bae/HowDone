name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Release CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" != "tag" || "${RELEASE_TAG}" != v* ]]; then
            echo "::error::Release must run from a Git tag beginning with v (received: ${RELEASE_TAG})."
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION}" node --input-type=module <<'NODE'
          const version = process.env.VERSION;
          const numericIdentifier = "(0|[1-9][0-9]*)";
          const nonNumericIdentifier = "[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*";
          const prereleaseIdentifier = `(?:${numericIdentifier}|${nonNumericIdentifier})`;
          const buildIdentifier = "[0-9A-Za-z-]+";
          const semver = new RegExp(
            `^${numericIdentifier}\\.${numericIdentifier}\\.${numericIdentifier}` +
              `(?:-${prereleaseIdentifier}(?:\\.${prereleaseIdentifier})*)?` +
              `(?:\\+${buildIdentifier}(?:\\.${buildIdentifier})*)?$`,
          );

          if (typeof version !== "string" || !semver.test(version)) {
            console.error(`::error::Invalid release tag version: ${version}`);
            console.error("Expected vX.Y.Z or vX.Y.Z-prerelease, using npm SemVer.");
            process.exit(1);
          }
          const { readFileSync } = await import("node:fs");
          const core = JSON.parse(readFileSync("packages/core/package.json", "utf8"));
          const cli = JSON.parse(readFileSync("packages/cli/package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));

          for (const [name, metadata] of [["core", core], ["cli", cli]]) {
            if (metadata.version !== version) {
              console.error(`::error::${name} package version ${metadata.version} does not match release tag version ${version}.`);
              process.exit(1);
            }
          }

          const lockPackages = lock.packages ?? {};
          for (const [path, metadata] of [["packages/core", core], ["packages/cli", cli]]) {
            if (lockPackages[path]?.version !== metadata.version) {
              console.error(`::error::package-lock.json entry ${path} is not synchronized with ${metadata.name}@${metadata.version}.`);
              process.exit(1);
            }
          }

          if (cli.dependencies?.howdone !== core.version) {
            console.error(`::error::CLI dependency howdone ${cli.dependencies?.howdone} does not match core version ${core.version}.`);
            process.exit(1);
          }
          NODE

      - name: Build release package
        run: npm run build:cli

      - name: Publish the core package
        run: npm publish --workspace packages/core --tag latest --access public

      - name: Publish the CLI package
        run: npm publish --workspace packages/cli --tag latest --access public
