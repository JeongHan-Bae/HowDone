name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable release tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Release CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck release validator
        run: npm run typecheck:release

      - name: Validate release tag, versions, and registry state
        id: validate
        run: |
          set -euo pipefail
          node scripts/validate-release.mjs "${RELEASE_TAG}"

      - name: Build release package
        run: npm run build:cli

      - name: Publish the core package
        if: steps.validate.outputs.publish_core == 'true'
        run: npm publish --workspace packages/core --tag latest --access public

      - name: Check exact core dependency before CLI publish
        if: steps.validate.outputs.publish_cli == 'true'
        env:
          CORE_VERSION: ${{ steps.validate.outputs.core_version }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            published_version="$(npm view "howdone@${CORE_VERSION}" version --json 2>/dev/null || true)"
            if [[ "${published_version}" == "\"${CORE_VERSION}\"" ]]; then
              echo "howdone@${CORE_VERSION} is available from npm; continuing to CLI publish."
              exit 0
            fi
            sleep 2
          done
          echo "::error::required howdone@${CORE_VERSION} is not available for the CLI publish."
          exit 1

      - name: Publish the CLI package
        if: steps.validate.outputs.publish_cli == 'true'
        run: npm publish --workspace packages/cli --tag latest --access public
