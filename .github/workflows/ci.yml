name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit committed dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  checks:
    name: Node.js ${{ matrix.node }}
    needs: dependency-audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "18.x"
          - node: "20.x"
          - node: "22.x"
          - node: "24.x"
          - node: "26.x"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run TDD and regression tests
        run: npm test

      - name: Run BDD tests
        run: npm run test:bdd

      - name: Verify npm package contents
        run: npm run pack:check
