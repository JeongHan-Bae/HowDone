name: CI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "bin/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "tsconfig.cli-build.json"
      - "tsconfig.test-build.json"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "bin/**"
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "tsconfig.cli-build.json"
      - "tsconfig.test-build.json"
  workflow_call:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu / Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy: &node_matrix
      fail-fast: false
      matrix:
        node:
          - "18.x"
          - "20.x"
          - "22.x"
          - "24.x"
          - "26.x"
    steps: &ci_steps
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck maintenance files
        run: npm run typecheck:maintenance

      - name: Check platform-neutral source
        run: npm run check:platform

      - name: Run TDD and regression tests
        run: npm test

      - name: Run BDD tests
        run: npm run test:bdd

      - name: Build and run compiled TDD and BDD tests
        run: npm run test:compiled

      - name: Install local packages in a sandbox and run local-install tests
        run: npm run test:local-install

      - name: Verify npm package contents
        run: npm run pack:check

  macos:
    name: macOS / Node.js ${{ matrix.node }}
    runs-on: macos-latest
    strategy: *node_matrix
    steps: *ci_steps

  windows:
    name: Windows / Node.js ${{ matrix.node }}
    runs-on: windows-latest
    strategy: *node_matrix
    steps: *ci_steps
